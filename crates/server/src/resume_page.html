<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
@page {{ size: A4; margin: 8mm 10mm; }}
* {{ box-sizing: border-box; }}
html {{ font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: {base}pt; color: #1a1a1a; }}
body {{ margin: 0; padding: 0; }}

/* ── Header ── */
.hdr {{ padding-bottom: 4pt; border-bottom: 1.5pt solid #1a3a6b; margin-bottom: 3pt; }}
.legal-name {{ font-size: {h1}pt; font-weight: 700; margin: 0 0 1.5pt 0; color: #1a3a6b; }}
.contact-line {{ font-size: {small}pt; margin: 0; color: #444; line-height: 1.4; }}

/* ── Sections ── */
section {{ margin-top: 5pt; }}
section:first-of-type {{ margin-top: 2pt; }}
h2 {{
  font-size: {h2}pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4pt;
  margin: 0 0 2pt 0;
  padding-bottom: 1pt;
  border-bottom: 0.75pt solid #c5d3ea;
  color: #1a3a6b;
}}

/* ── Job entries ── */
.job {{ margin-bottom: 4pt; }}
h3 {{ font-size: {h3}pt; font-weight: 700; margin: 2pt 0 0 0; color: #111; }}
.job-meta {{ font-size: {small}pt; margin: 0.5pt 0 1.5pt 0; color: #555; }}
.role {{ font-weight: 700; }}
.company {{ font-style: italic; }}
.dash {{ color: #888; }}

/* ── Lists ── */
ul {{ margin: 1pt 0 0 10pt; padding: 0; }}
li {{ margin-bottom: 1.5pt; line-height: {li_h}; }}

/* ── Skills ── */
.skills-block {{ font-size: {small}pt; line-height: 1.45; }}

/* ── Two-column table layout (education + certs side-by-side) ── */
table.layout-cols {{ border-collapse: collapse; width: 100%; }}
table.layout-cols td {{ vertical-align: top; padding: 0; }}

/* ── Typography ── */
p {{ margin: 1pt 0; line-height: 1.24; }}
strong {{ font-weight: 700; }}
em {{ font-style: italic; }}
a {{ color: #1a3a6b; text-decoration: none; }}
</style></head><body>{inner}</body></html>
