[package]
name = "jumpship-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3.34"
jumpship-core = { path = "../core" }
jumpship-sources = { path = "../sources" }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "gzip", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4"] }
