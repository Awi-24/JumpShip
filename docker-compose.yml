services:

  # ── Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jumpship-backend
    ports:
      - "8000:8000"
    volumes:
      - jumpship-db:/app/data
      - jumpship-uploads:/app/uploads
      - jumpship-agents:/app/agents_db
    environment:
      DATABASE_URL: sqlite:////app/data/jobspy_ui.db
      UPLOAD_DIR: /app/uploads
      LANGGRAPH_DB_PATH: /app/agents_db/jumpship_agents.db
      # Allow requests from the nginx frontend container and direct API access
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8000"
      # Agent V2 Config
      V2_AGENTS_ENABLED: "true"
      # LLM config
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      # Ollama runs on the host; host.docker.internal reaches it from inside the container.
      # Both OLLAMA_BASE_URL (pydantic-settings field) and OLLAMA_HOST (LLMService env fallback)
      # are set so all code paths resolve to the correct address.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      # Maps host.docker.internal → host gateway on Linux Docker Engine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jumpship-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jumpship-db:
  jumpship-uploads:
  jumpship-agents:
