services:

  # ── Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jumpship-backend
    ports:
      - "8000:8000"
    volumes:
      - jumpship-db:/app/data
      - jumpship-uploads:/app/uploads
      - jumpship-generated:/app/generated_resumes
    environment:
      # Pydantic default is debug=false; .env is not baked into the image (.dockerignore).
      # Without this, startup fails on the default SECRET_KEY. This compose file is for
      # local stacks — for production, use a real SECRET_KEY and set DEBUG=false (override).
      DEBUG: "true"
      DATABASE_URL: sqlite:////app/data/jobspy_ui.db
      UPLOAD_DIR: /app/uploads
      RESUME_OUTPUT_DIR: /app/generated_resumes
      # Allow nginx frontend, direct API access, and local Vite dev (npm run dev)
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8000,http://localhost:5173"
      # LLM config
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      # Ollama runs on the host; host.docker.internal reaches it from inside the container.
      # Both OLLAMA_BASE_URL (pydantic-settings field) and OLLAMA_HOST (LLMService env fallback)
      # are set so all code paths resolve to the correct address.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # LM Studio on the host (same pattern as Ollama). Override in `.env` if your server uses another port.
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      # Maps host.docker.internal → host gateway on Linux Docker Engine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # Hits FastAPI /api/health (backend/routers/health.py).
      # Expected: HTTP 200 with JSON {"status": "ok", ...}. curl -f fails on non-2xx.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jumpship-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jumpship-db:
  jumpship-uploads:
  jumpship-generated:
